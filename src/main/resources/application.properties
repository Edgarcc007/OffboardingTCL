spring.flyway.repair-on-migrate=true
spring.flyway.validate-on-migrate=false

# ============================================
# SMTP - Exchange TCL (mail.tcl.com:587)
# ============================================
spring.mail.host=${SPRING_MAIL_HOST:mail.tcl.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ============================================
# Power Automate Flow URL
# ============================================
flow.html-table.url=https://default334fe9990df741228b7c3b91b36455.88.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/31/workflows/9f10a8d3be694190a2bb29fa9c08bc8f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=HaP1r4ut2A5vTsy1xFhkRZ-8Ga0cxWB80hcTCvu3AbA

# ============================================
# Notificaciones
# ============================================
notification.from=${NOTIFICATION_FROM:${SPRING_MAIL_USERNAME}}
notification.default-to=${NOTIFICATION_DEFAULT_TO:${SPRING_MAIL_USERNAME}}
app.notifications.enabled=${APP_NOTIFICATIONS_ENABLED:true}

server.servlet.session.timeout=8h
