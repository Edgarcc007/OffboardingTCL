spring:
  application:
    name: offboarding

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  address: 0.0.0.0
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

app:
  security:
    admin-username: ${ADMIN_USERNAME}
    admin-password: ${ADMIN_PASSWORD}
    admin-fullname: ${ADMIN_FULLNAME:Administrador del sistema}
    admin-email: ${ADMIN_EMAIL:admin@empresa.com}

logging:
  level:
    org.springframework.security: INFO